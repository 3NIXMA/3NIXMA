  <style>
    /* 3NIXMA / Corrected palette roles
       Obsidian: deepest black foundation
       Emberghost: charcoal surface / industrial depth
       Witchwine: deep plum, interior/private/art atmosphere
       Crywave: teal signal, technical precision, action
       Clay Sigil: earthen material, restoration, built work */
    :root{
      --obsidian:#050505;
      --emberghost:#2D2E31;
      --witchwine:#34112E;
      --witchwine-deep:#21091D;
      --crywave:#2BB9AE;
      --crywave-light:#8BE5DD;
      --clay-sigil:#A66B56;
      --ash:#F1ECE5;
      --ash-dark:#CFC6BC;
      --line:3px solid var(--obsidian);
      --light-line:3px solid var(--ash);
    }
    *{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth} body{font-family:"Space Grotesk",Arial,sans-serif;background:var(--obsidian);color:var(--ash);line-height:1.5;overflow-x:hidden} a{color:inherit;text-decoration:none}button{font:inherit}

    .site-header{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.95);backdrop-filter:blur(12px);border-bottom:var(--light-line)}.header-inner{width:min(1440px,100%);margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:20px}.wordmark{font:600 13px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--crywave-light)}.nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.nav a{font:600 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;padding:8px 0;border-bottom:2px solid transparent}.nav a:hover{border-color:var(--crywave)}.menu-btn{display:none;border:var(--light-line);background:var(--crywave);color:var(--obsidian);padding:9px 12px;font:600 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase}
    .page{width:min(1440px,100%);margin:auto}.hero{min-height:calc(100svh - 54px);display:grid;grid-template-columns:43% 57%;border-bottom:var(--light-line)}.hero-copy{padding:clamp(26px,4vw,66px) clamp(18px,3vw,48px);display:flex;flex-direction:column;justify-content:space-between;border-right:var(--light-line);background:var(--obsidian)}.micro{font:600 12px/1.35 "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--crywave-light)}
    .hero h1{margin:40px 0 22px;font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(66px,9.2vw,157px);line-height:.73;letter-spacing:-.105em;text-transform:uppercase;max-width:7.8ch;color:var(--ash)}.hero h1 span{display:block}.hero h1 span:nth-child(2){color:var(--crywave)}.hero h1 span:nth-child(4){color:var(--clay-sigil)}.hero p{font:500 clamp(15px,1.35vw,19px)/1.45 "IBM Plex Mono",monospace;max-width:37ch;color:var(--ash)}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 17px;border:var(--light-line);background:transparent;color:var(--ash);font:700 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;box-shadow:4px 4px 0 var(--crywave);transition:transform .18s ease,box-shadow .18s ease}.btn:hover{transform:translate(4px,4px);box-shadow:none}.btn-primary{background:var(--crywave);border-color:var(--crywave);color:var(--obsidian);box-shadow:4px 4px 0 var(--ash)}

    section{border-bottom:var(--light-line)}.section-intro{display:grid;grid-template-columns:28% 72%;background:var(--ash);color:var(--obsidian)}.section-label{padding:22px 18px;border-right:var(--line);background:var(--clay-sigil);font:600 12px/1.5 "IBM Plex Mono",monospace;text-transform:uppercase}.section-title{padding:clamp(28px,4vw,60px) clamp(18px,4vw,64px)}.section-title h2{font-family:"Archivo Black",sans-serif;font-size:clamp(46px,7vw,110px);line-height:.76;letter-spacing:-.1em;text-transform:uppercase;max-width:10ch}.section-title p{max-width:58ch;margin-top:28px;font:500 15px/1.55 "IBM Plex Mono",monospace}

    .current{display:grid;grid-template-columns:1.1fr .9fr}.current-copy{padding:clamp(28px,4vw,60px);border-right:var(--light-line);background:var(--emberghost);color:var(--ash)}.current-copy h2{font-family:"Archivo Black",sans-serif;font-size:clamp(52px,7vw,116px);line-height:.75;letter-spacing:-.11em;text-transform:uppercase;max-width:8ch}.current-copy p{max-width:46ch;margin-top:28px;font:500 14px/1.55 "IBM Plex Mono",monospace}.work-list{display:grid}.work-item{padding:20px;min-height:144px;border-bottom:var(--line);display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;background:var(--ash)}.work-item:last-child{border-bottom:0}.work-item .status{width:42px;height:42px;border-radius:50%;border:var(--line);background:var(--crywave);color:var(--obsidian);display:grid;place-items:center;font:700 11px/1 "IBM Plex Mono",monospace}.work-item h3{font-family:"Archivo Black",sans-serif;font-size:clamp(23px,2.5vw,38px);line-height:.85;letter-spacing:-.07em;text-transform:uppercase}.work-item p{font:500 12px/1.45 "IBM Plex Mono",monospace;color:#444;max-width:38ch}.work-item small{font:600 10px/1.3 "IBM Plex Mono",monospace;text-transform:uppercase;text-align:right;color:var(--witchwine)}
    .statement{min-height:65vh;padding:clamp(30px,7vw,110px) clamp(18px,5vw,72px);background:var(--witchwine-deep);position:relative;overflow:hidden}.statement::after{content:"3N";position:absolute;right:-.08em;bottom:-.2em;font-family:"Archivo Black",sans-serif;font-size:clamp(250px,45vw,660px);letter-spacing:-.18em;color:var(--clay-sigil);opacity:.28;line-height:.7}.statement h2{position:relative;z-index:2;font-family:"Archivo Black",sans-serif;font-size:clamp(62px,11.3vw,180px);letter-spacing:-.12em;line-height:.72;text-transform:uppercase;max-width:8.7ch;color:var(--ash)}.statement h2::first-line{color:var(--crywave)
